name: Release

on:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Check that the tag matches the app version
        run: |
          version="${GITHUB_REF_NAME#v}"
          conf=$(jq -r .version src-tauri/tauri.conf.json)
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          if [ "$conf" != "$version" ] || [ "$crate" != "$version" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in tauri.conf.json ($conf) and Cargo.toml ($crate)."
            exit 1
          fi
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test

  # One draft release, which every build adds its files to. Publish it by hand after checking it.
  # SignPath Foundation requires the code signing policy on every download page, so the notes end with it.
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      id: ${{ steps.create.outputs.id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" -f tag_name="$GITHUB_REF_NAME" --jq .body)
          policy="## Code signing policy

          Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org). See the [code signing policy](https://github.com/$GITHUB_REPOSITORY#code-signing-policy)."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" \
            -f name="Embervale Tracker $GITHUB_REF_NAME" \
            -F draft=true \
            -f body="$notes

          $policy" \
            --jq .id)
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 22.04 links the AppImage against an older glibc, so it runs on more distributions.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Install the WebKitGTK build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      # Linux gets an AppImage and a .deb, which tauri-action builds and attaches.
      - uses: tauri-apps/tauri-action@v0
        if: runner.os == 'Linux'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          releaseId: ${{ needs.release.outputs.id }}
          tauriScript: bun tauri
      # Windows gets only the exe, which runs without installing. WebView2 ships with Windows 10 and 11.
      - name: Build the Windows exe
        if: runner.os == 'Windows'
        run: bun tauri build --no-bundle
      - name: Attach the Windows exe
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          portable="embervale-tracker_${GITHUB_REF_NAME#v}_x64-portable.exe"
          cp src-tauri/target/release/embervale-tracker.exe "$portable"
          gh release upload "$GITHUB_REF_NAME" "$portable"
